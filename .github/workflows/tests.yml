name: Python compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libegl1 libopengl0 libxkbcommon0
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed --name LocalVoice --icon assets/localvoice.ico --add-data 'assets;assets' --collect-data _sounddevice_data main.py
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-app-without-models-or-whisper-runtime
          path: dist/LocalVoice/
  next-python:
    # Early warning only: native wheels may not exist yet for the next CPython.
    continue-on-error: true
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15-dev'
          allow-prereleases: true
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --pre -e '.[dev]'
      - run: python -m pytest -q
