[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "localvoice"
version = "0.2.0"
description = "Private offline desktop dictation with Whisper and Silero VAD"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{name = "LocalVoice contributors"}]
dependencies = [
  "PySide6>=6.11.2,<7",
  "numpy>=2.5.3,<3",
  "scipy>=1.17.1,<2",
  "sounddevice>=0.5.6,<1",
  "requests>=2.34.2,<3",
  "pynput>=1.8.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1,<10", "pyinstaller>=6.22.3,<7", "pillow>=12.3.0,<13"]

[tool.setuptools]
packages = ["localvoice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:localvoice.*"]
